<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Cart 🌸</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="cart.html">Cart <span id="cart-count" class="cart-badge">0</span></a>
      <span id="nav-auth-area"></span>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">Your Cart</h2>
    <div id="cart-items" class="cart-items">
      <!-- cart items injected by app.js -->
    </div>

    <div class="cart-summary">
      <h3>Total: Rs. <span id="cart-total">0</span></h3>
      <button id="checkout-btn" class="btn btn-primary">Place Order</button>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Cart. Made with 🤎</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
