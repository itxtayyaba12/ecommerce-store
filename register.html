<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register |  Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Cart 🌸</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="cart.html">Cart <span id="cart-count" class="cart-badge">0</span></a>
      <span id="nav-auth-area"></span>
    </nav>
  </header>

  <main class="container form-container">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="auth-subtitle">Join Cart today</p>

      <form id="register-form">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="Tayyaba Khan" required>

        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required>

        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" required>

        <button type="submit" class="btn btn-primary btn-full">Register</button>
      </form>

      <p id="register-message" class="form-message"></p>

      <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Cart. Made with 🤎</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
