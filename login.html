<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login |Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Cart 🌸</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="cart.html">Cart <span id="cart-count" class="cart-badge">0</span></a>
      <span id="nav-auth-area"></span>
    </nav>
  </header>

  <main class="container form-container">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Login to continue shopping</p>

      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>

        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>

      <p id="login-message" class="form-message"></p>

      <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 Cart. Made with 🤎</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
